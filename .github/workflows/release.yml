name: Publish GitHub release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish universal package
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag and source
        env:
          TAG: ${{ github.ref_name }}
        run: |
          xcodebuild -version
          version="${TAG#v}"
          project_version="$(awk '/MARKETING_VERSION =/{gsub(/;/, "", $3); print $3; exit}' PDFWorkBench.xcodeproj/project.pbxproj)"
          test "$version" = "$project_version"
          grep -qx "status=release-candidate-v$version" .release-source
          scripts/check-sensitive-info.sh
          scripts/check-sensitive-info.sh --history
          git diff --check

      - name: Build and package universal app
        env:
          TAG: ${{ github.ref_name }}
        run: |
          scripts/package-release.sh "${TAG#v}" "$RUNNER_TEMP/release-assets"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          gh release create "$TAG" "$RUNNER_TEMP/release-assets/v$version/"* \
            --verify-tag \
            --title "Dogear $version" \
            --notes "Dogear $version. This release includes a universal macOS package, source archive, and SHA-256 checksums. The app package is unsigned; build from source when you need a locally signed build."
