name: Verify tagged release source

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged source
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag and source
        env:
          TAG: ${{ github.ref_name }}
        run: |
          xcodebuild -version
          version="${TAG#v}"
          project_version="$(awk '/MARKETING_VERSION =/{gsub(/;/, "", $3); print $3; exit}' PDFWorkBench.xcodeproj/project.pbxproj)"
          test "$version" = "$project_version"
          grep -qx "status=release-candidate-v$version" .release-source
          scripts/check-sensitive-info.sh
          scripts/check-sensitive-info.sh --history
          git diff --check

      - name: Verify builds and release metadata
        run: scripts/verify-release.sh
