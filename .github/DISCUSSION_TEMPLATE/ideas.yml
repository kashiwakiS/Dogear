title: "[Idea] "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: Search existing Ideas first and upvote a matching discussion instead of duplicating it.
  - type: textarea
    id: problem
    attributes:
      label: Reading or PDF workflow problem
      description: Describe the problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: File-safety or privacy considerations
